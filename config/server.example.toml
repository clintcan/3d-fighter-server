[server]
region = "asia"
http_bind = "0.0.0.0:8080"     # WebSocket + HTTP; put TLS in front (Caddy/nginx) or set [tls]
udp_bind = "0.0.0.0:7780"
public_udp_host = "fighter-asia.example.com"   # what clients are told in welcome.udp
log_format = "json"            # or "pretty"
log_ips = false
# Reverse proxies whose X-Forwarded-For / X-Real-IP headers are trusted (IPs or
# IPv4 CIDR). Required when TLS terminates at Caddy/nginx, so bans and per-IP
# limits apply to the real client instead of the proxy. Empty = trust nobody.
trusted_proxies = []
# UDP socket buffers (issue #18). The kernel caps these at net.core.rmem_max /
# wmem_max; raise those sysctls too, and check the granted size in the logs.
udp_recv_buffer = 4194304
udp_send_buffer = 1048576

[tls]                          # optional: terminate TLS in-process
# cert = "/etc/fighter/cert.pem"
# key = "/etc/fighter/key.pem"

[game]
min_game_version = "0.4.1"     # older clients are refused
latest_game_version = "0.4.1"  # newer releases trigger an update prompt
update_url = "https://github.com/clintcan/3d-fighter/releases/latest"
motd = "Welcome to 3D Fighter online!"

[limits]
max_connections = 10000
# Players behind carrier-grade NAT, a LAN, or one household share a public IP.
# Raise this if many of them connect from the same address.
max_connections_per_ip = 32
max_rooms = 5000
default_spectator_delay_ms = 3000
# A feed may not run more than this many ticks ahead of real time (60/s).
feed_max_backlog_ticks = 120
# Server-wide cap on in-memory match logs.
max_match_log_bytes = 268435456
# Replay store quotas (oldest evicted first).
max_replays = 1000
max_replay_bytes = 536870912
# HTTP: close slow/incomplete requests and bound raw connections.
http_header_timeout_ms = 10000
max_http_connections = 10000
# Per-connection WebSocket buffers (issue #20) and idle close (issue #21).
ws_read_buffer = 16384
ws_write_buffer = 16384
ws_max_write_buffer = 262144
ws_pong_timeout_ms = 60000
# Admin auth failures per address before a lockout, and the lockout length.
admin_max_failures = 10
admin_lockout_ms = 300000

[admin]
token_env = "FIGHTER_ADMIN_TOKEN"   # admin API enabled only if this variable is set
# token = "..."                     # optional inline override (tests)

[moderation]
blocklist = []                      # rejected name/room-name words

[storage]                      # milestone 5
replays = true
database = "/var/lib/fighter/fighter.db"
replay_dir = "/var/lib/fighter/replays"
replay_retention_days = 7

# Region discovery (`GET /v1/regions`). Leave empty to advertise this server.
[[regions]]
region = "asia"
ws_url = "wss://fighter-asia.example.com/v1/ws"
udp_host = "fighter-asia.example.com"
udp_port = 7780
