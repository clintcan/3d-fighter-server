[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/server",
    "crates/client-sim",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/clintcan/3d-fighter"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
prometheus = "0.13"
rand = "0.8"
subtle = "2"
hex = "0.4"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
